<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>消息中心 · 麓邦业务中台</title>
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/common.css">
<style>
  .msg-layout { display: grid; grid-template-columns: 216px 1fr; gap: 16px; align-items: start; }
  .cat-panel { background: var(--bmp-bg-card); border-radius: var(--bmp-radius-md); box-shadow: var(--bmp-shadow-1); padding: 8px; position: sticky; top: calc(var(--bmp-topbar-h) + 24px); }
  .cat-panel .cat { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-radius: var(--bmp-radius-sm); cursor: pointer; font-size: 14px; color: var(--bmp-text-body); }
  .cat-panel .cat:hover { background: var(--bmp-color-primary-light); color: var(--bmp-color-primary); }
  .cat-panel .cat.active { background: var(--bmp-color-primary-light); color: var(--bmp-color-primary); font-weight: 600; }
  .cat-panel .cat .n { font: var(--bmp-font-caption); color: var(--bmp-text-placeholder); }
  .cat-panel .cat.active .n { color: var(--bmp-color-primary); }
  .cat-panel .read-all { margin: 8px 4px 4px; border-top: 1px solid var(--bmp-border); padding-top: 10px; }
  .msg-list { background: var(--bmp-bg-card); border-radius: var(--bmp-radius-md); box-shadow: var(--bmp-shadow-1); }
  .msg-row { display: flex; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--bmp-border); cursor: pointer; }
  .msg-row:hover { background: var(--surface); }
  .msg-row:last-child { border-bottom: none; }
  .msg-row .unread { width: 8px; height: 8px; border-radius: 50%; background: var(--bmp-color-danger); flex-shrink: 0; margin-top: 7px; }
  .msg-row .read-dot { width: 8px; flex-shrink: 0; }
  .msg-row .body { flex: 1; min-width: 0; }
  .msg-row .t1 { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  .msg-row .title { font-size: 14px; font-weight: 600; color: var(--bmp-text-title); }
  .msg-row.readed .title { font-weight: 400; color: var(--bmp-text-body); }
  .msg-row .time { font: var(--bmp-font-caption); color: var(--bmp-text-placeholder); white-space: nowrap; }
  .msg-row .preview { font: var(--bmp-font-caption); color: var(--bmp-text-secondary); margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .msg-detail { background: var(--bmp-bg-card); border-radius: var(--bmp-radius-md); box-shadow: var(--bmp-shadow-1); padding: 24px 28px; }
  .msg-detail h2 { font: var(--bmp-font-h2); color: var(--bmp-text-title); margin-bottom: 8px; }
  .msg-detail .meta { font: var(--bmp-font-caption); color: var(--bmp-text-secondary); padding-bottom: 16px; border-bottom: 1px solid var(--bmp-border); margin-bottom: 16px; display: flex; gap: 16px; }
  .msg-detail .content { font-size: 14px; line-height: 1.9; color: var(--bmp-text-body); }
</style>
<script src="assets/ui-style.js"></script>
</head>
<body>
<div id="topbar"></div>
<main class="portal-main">
  <div id="stateHost"></div>
  <h1 style="font:var(--bmp-font-h2);color:var(--bmp-text-title);margin-bottom:16px">消息中心</h1>
  <div class="msg-layout">
    <!-- 左分类（带未读计数） -->
    <div class="cat-panel" id="catPanel"></div>
    <!-- 右消息流 / 详情 -->
    <div id="rightPane"></div>
  </div>
</main>

<!-- 全部已读二次确认（UIUX 4.3：Dialog 高危边界——批量状态变更需确认） -->
<div class="modal-mask" id="m-readall">
  <div class="modal" style="width:400px">
    <div class="modal-head"><h3>全部标记已读？</h3><button class="modal-close" onclick="closeModal('m-readall')">✕</button></div>
    <div class="modal-body text-secondary">当前分类下 <b id="unreadN">0</b> 条未读消息将全部标记为已读，此操作不可撤销。</div>
    <div class="modal-foot">
      <button class="btn" onclick="closeModal('m-readall')">取消</button>
      <button class="btn btn-primary" onclick="doReadAll()">全部已读</button>
    </div>
  </div>
</div>

<script src="assets/mock.js"></script>
<script>
document.getElementById("topbar").innerHTML = renderTopbar("messages");
const CATS = ["全部", "待办提醒", "审批结果", "公告", "系统通知"];
let curCat = "全部", curDetail = null;

function catList(cat) { return cat === "全部" ? MOCK.messages : MOCK.messages.filter(m => m.cat === cat); }
function renderCats() {
  document.getElementById("catPanel").innerHTML = CATS.map(c => {
    const n = catList(c).filter(m => m.unread).length;
    return `<div class="cat ${c === curCat ? "active" : ""}" onclick="selectCat('${c}')"><span>${c}</span><span class="n">${n ? "(" + n + ")" : ""}</span></div>`;
  }).join("") + `<div class="read-all"><button class="btn btn-sm" style="width:100%" onclick="openModal('m-readall')">✓ 当前分类全部已读</button></div>`;
  document.getElementById("unreadN").textContent = catList(curCat).filter(m => m.unread).length;
}
function selectCat(c) { curCat = c; curDetail = null; renderCats(); renderList(); }
function renderList() {
  const list = catList(curCat);
  const pane = document.getElementById("rightPane");
  if (!list.length) {
    pane.innerHTML = `<div class="msg-list"><div class="state-box"><div class="illus">📭</div><div class="txt">该分类暂无消息</div><div class="code">可切换到其他分类，或前往首页查看待办</div><a class="btn btn-sm btn-primary" href="home-v2.html">返回工作台</a></div></div>`;
    return;
  }
  pane.innerHTML = `<div class="msg-list">` + list.map(m => `
    <div class="msg-row ${m.unread ? "" : "readed"}" onclick="openMsg(${m.id})">
      ${m.unread ? '<span class="unread"></span>' : '<span class="read-dot"></span>'}
      <div class="body">
        <div class="t1"><span class="title">${m.top ? '<b class="text-primary">📢</b> ' : ""}${m.title}</span><span class="time">${m.time}</span></div>
        <div class="preview">${m.body}</div>
      </div>
      <span class="tag tag-info" style="flex-shrink:0;align-self:center">${m.cat}</span>
    </div>`).join("") + `</div>`;
}
function openMsg(id) {
  const m = MOCK.messages.find(x => x.id === id);
  if (!m) return;
  m.unread = false; // 点击即已读
  curDetail = id;
  renderCats();
  document.getElementById("rightPane").innerHTML = `
    <div class="msg-detail">
      <a class="fs-13" href="javascript:curDetail=null;renderList()">← 返回消息列表</a>
      <h2 class="mt-3">${m.title}</h2>
      <div class="meta"><span>${m.cat}</span><span>${m.time}</span><span>来源：站内信（msgId: MSG-20260922-${String(m.id).padStart(4, "0")}）</span></div>
      <div class="content">${m.body}</div>
      ${m.jumpUrl ? `<div class="mt-4"><button class="btn btn-primary" onclick="${m.jumpUrl.replace(/"/g, '&quot;')}">查看详情 →</button></div>` : ""}
    </div>`;
  // 同步列表已读态（保留列表滚动位置的简化实现：仅当从列表进入）
}
function doReadAll() {
  catList(curCat).forEach(m => m.unread = false);
  closeModal("m-readall");
  msg("success", "当前分类已全部标记为已读");
  renderCats(); curDetail ? null : renderList();
}
/* ============================================================
   五态演示（UIUX §4.2）：加载 / 空 / 错误 / 无权限
   —— 默认态走正常渲染，其余态用状态占位替换列表区
   ============================================================ */
function renderPage() { stateSwitcher("stateHost", function () { applyState(); }); applyState(); }
function applyState() {
  var st = pageState();
  var lay = document.querySelector(".msg-layout");
  var old = document.getElementById("stateBox");
  if (st === "normal") {
    if (lay) lay.style.display = "";
    if (old) old.remove();
    renderCats(); renderList();
    return;
  }
  if (lay) lay.style.display = "none";
  var box = old;
  if (!box) { box = document.createElement("div"); box.id = "stateBox"; document.getElementById("stateHost").after(box); }
  renderStateBox(box, st, { name: "消息", emptyText: "暂无消息", emptyHint: "有新消息时会在此展示", action: "去应用中心看看", actionHref: "apps.html" });
}
renderPage();
</script>
</body>
</html>
