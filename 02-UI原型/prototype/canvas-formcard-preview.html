<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>画布字段卡预览</title>
<!-- 变量统一取自外链 Token 层（Notion 暖色体系），本页不再内嵌 :root 副本，
     否则页面级变量会覆盖 tokens.css 导致回到旧冷灰色系 -->
<link rel="stylesheet" href="assets/tokens.css">
<style>/* ============================================================
   本页组件样式（画布 / 字段卡 / 工具栏等业务样式）
   变量统一由 assets/tokens.css 提供（Notion 暖色体系双轨制）
   ============================================================ */
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font: var(--bmp-font-body);
  color: var(--bmp-text-body);
  background: var(--bmp-bg-page);
  font-variant-numeric: tabular-nums;
}
a { color: var(--bmp-color-primary); text-decoration: none; }
a:hover { color: var(--bmp-color-primary-dark); }
ul, ol { list-style: none; }

/* ---------- 按钮 ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 32px; padding: 0 16px; border-radius: var(--bmp-radius-btn);
  border: 1px solid var(--bmp-border-strong); background: #fff;
  font: var(--bmp-font-body); color: var(--bmp-text-body);
  cursor: pointer; transition: all .15s ease-out; white-space: nowrap;
}
.btn:hover { color: var(--bmp-color-primary); border-color: var(--bmp-color-primary); }
.btn-primary { background: var(--bmp-color-primary); border-color: var(--bmp-color-primary); color: #fff; }
.btn-primary:hover { background: var(--bmp-color-primary-dark); border-color: var(--bmp-color-primary-dark); color: #fff; }
.btn-danger { background: var(--bmp-color-danger); border-color: var(--bmp-color-danger); color: #fff; }
.btn-danger:hover { opacity: .88; color: #fff; }
.btn-text { border: none; background: transparent; color: var(--bmp-color-primary); padding: 0 6px; height: auto; }
.btn-text:hover { color: var(--bmp-color-primary-dark); background: transparent; }
.btn-text.danger { color: var(--bmp-color-danger); }
.btn-sm { height: 26px; padding: 0 10px; font-size: 12px; }
.btn-lg { height: 40px; padding: 0 24px; font-size: 16px; }
.btn:disabled { opacity: .5; cursor: not-allowed; pointer-events: none; }
.btn.loading::before { content: ""; width: 12px; height: 12px; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- 标签 ---------- */
.tag { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: var(--bmp-radius-sm); font: var(--bmp-font-caption); }
.tag-success { background: var(--bmp-color-success-light); color: var(--bmp-color-success); }
.tag-warning { background: var(--bmp-color-warning-light); color: #B45309; }
.tag-danger  { background: var(--bmp-color-danger-light);  color: var(--bmp-color-danger); }
.tag-info    { background: var(--bmp-color-info-light);    color: var(--bmp-text-secondary); }
.tag-primary { background: var(--bmp-color-primary-light); color: var(--bmp-color-primary); }

/* 待办紧急度圆点 */
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.dot-urgent { background: var(--accent); }
.dot-important { background: var(--bmp-color-warning); }
.dot-normal { background: var(--bmp-color-info); }

/* ---------- 表单 ---------- */
.field { margin-bottom: 16px; }
.field > label { display: block; margin-bottom: 6px; font-size: 14px; color: var(--bmp-text-title); }
.field > label .req { color: var(--bmp-color-danger); margin-right: 2px; }
.input, .select, textarea.input {
  width: 100%; height: 32px; padding: 0 12px;
  border: 1px solid var(--bmp-border-strong); border-radius: var(--bmp-radius-sm);
  font: var(--bmp-font-body); color: var(--bmp-text-body); background: #fff;
  transition: border-color .15s;
}
textarea.input { height: auto; padding: 8px 12px; resize: vertical; }
.input:focus, .select:focus, textarea.input:focus { outline: none; border-color: var(--bmp-color-primary); box-shadow: 0 0 0 2px var(--bmp-color-primary-light); }
.input::placeholder { color: var(--bmp-text-placeholder); }
.field .err-msg { display: none; margin-top: 4px; font: var(--bmp-font-caption); color: var(--bmp-color-danger); }
.field.has-error .input { border-color: var(--bmp-color-danger); }
.field.has-error .err-msg { display: block; }
.field .tip { margin-top: 4px; font: var(--bmp-font-caption); color: var(--bmp-text-secondary); }

/* ---------- 卡片 ---------- */
.card {
  background: var(--bmp-bg-card); border-radius: var(--bmp-radius-md);
  box-shadow: var(--bmp-shadow-1); padding: var(--bmp-space-4);
}
.card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.card-head h3 { font: var(--bmp-font-h3); color: var(--bmp-text-title); }
.card-head .more { font: var(--bmp-font-caption); color: var(--bmp-text-secondary); cursor: pointer; }
.card-head .more:hover { color: var(--bmp-color-primary); }

/* ---------- 表格 ---------- */
.table-wrap { background: #fff; border-radius: var(--bmp-radius-md); box-shadow: var(--bmp-shadow-1); overflow: auto; }
table.tbl { width: 100%; border-collapse: collapse; font: var(--bmp-font-body); }
.tbl th {
  text-align: left; padding: 10px 12px; background: var(--surface-sunken); white-space: nowrap;
  font-weight: 600; color: var(--bmp-text-title); border-bottom: 1px solid var(--bmp-border); font-size: 13px;
}
.tbl td { padding: 10px 12px; border-bottom: 1px solid var(--bmp-border); color: var(--bmp-text-body); vertical-align: middle; }
.tbl tr:hover td { background: var(--surface); }
.tbl tr.selected td { background: var(--bmp-color-primary-light); }
.tbl .ops { white-space: nowrap; }
.tbl .ops .btn-text + .btn-text { margin-left: 4px; }
.pagination { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 12px 16px; font: var(--bmp-font-caption); color: var(--bmp-text-secondary); }
.pagination .pg { min-width: 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center; border-radius: var(--bmp-radius-sm); cursor: pointer; border: 1px solid var(--bmp-border); background: #fff; padding: 0 6px; }
.pagination .pg.active { background: var(--bmp-color-primary); color: #fff; border-color: var(--bmp-color-primary); }

/* ---------- Tabs ---------- */
.tabs { display: flex; gap: 24px; border-bottom: 1px solid var(--bmp-border); }
.tabs .tab {
  padding: 10px 2px; cursor: pointer; font-size: 14px; color: var(--bmp-text-secondary);
  border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all .15s;
}
.tabs .tab:hover { color: var(--bmp-color-primary); }
.tabs .tab.active { color: var(--bmp-color-primary); border-bottom-color: var(--bmp-color-primary); font-weight: 600; }
.tabs .tab .badge-n { margin-left: 4px; }

/* 角标 */
.badge-n {
  display: inline-flex; align-items: center; justify-content: center; min-width: 16px; height: 16px;
  padding: 0 4px; border-radius: 8px; background: var(--bmp-color-danger); color: #fff;
  font: var(--bmp-font-caption); font-size: 11px;
}

/* ---------- 弹窗 / 抽屉 ---------- */
.modal-mask {
  display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, .45);
  z-index: 1000; align-items: center; justify-content: center;
}
.modal-mask.show { display: flex; }
.modal {
  width: 480px; max-width: calc(100vw - 32px); max-height: 84vh; overflow: auto;
  background: #fff; border-radius: var(--bmp-radius-lg); box-shadow: var(--bmp-shadow-3);
  animation: pop .18s ease-out;
}
@keyframes pop { from { transform: scale(.96); opacity: 0; } }
.modal-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 8px; }
.modal-head h3 { font: var(--bmp-font-h3); color: var(--bmp-text-title); }
.modal-close { cursor: pointer; border: none; background: none; font-size: 18px; color: var(--bmp-text-secondary); line-height: 1; }
.modal-close:hover { color: var(--bmp-text-title); }
.modal-body { padding: 8px 20px 16px; }
.modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 20px 16px; }

.drawer-mask { display: none; position: fixed; inset: 0; background: rgba(15,23,42,.45); z-index: 1000; }
.drawer-mask.show { display: block; }
.drawer {
  position: fixed; top: 0; right: -660px; width: 640px; max-width: 92vw; height: 100vh;
  background: #fff; box-shadow: var(--bmp-shadow-3); z-index: 1001;
  transition: right .2s ease-out; display: flex; flex-direction: column;
}
.drawer.show { right: 0; }
.drawer-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; border-bottom: 1px solid var(--bmp-border); }
.drawer-head h3 { font: var(--bmp-font-h3); color: var(--bmp-text-title); }
.drawer-body { flex: 1; overflow: auto; padding: 20px 24px; }

/* ---------- Message / Notification ---------- */
#msg-root { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 2000; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.msg-toast {
  display: flex; align-items: center; gap: 8px; padding: 9px 16px;
  background: #fff; border-radius: var(--bmp-radius-md); box-shadow: var(--bmp-shadow-2);
  font-size: 14px; animation: drop .2s ease-out; border: 1px solid var(--bmp-border);
}
@keyframes drop { from { transform: translateY(-12px); opacity: 0; } }
.msg-toast .ic { font-size: 15px; }
.msg-toast.success .ic { color: var(--bmp-color-success); }
.msg-toast.error .ic { color: var(--bmp-color-danger); }
.msg-toast.info .ic { color: var(--bmp-color-info); }

/* ---------- 全局状态（UIUX 4.2） ---------- */
.state-box { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 48px 0; color: var(--bmp-text-secondary); }
.state-box .illus { font-size: 44px; opacity: .8; }
.state-box .txt { font-size: 14px; }
.state-box .code { font: var(--bmp-font-caption); color: var(--bmp-text-placeholder); }

.skeleton { position: relative; overflow: hidden; background: var(--surface-hover); border-radius: var(--bmp-radius-sm); }
.skeleton::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.65), transparent);
  animation: shimmer 1.3s infinite;
}
@keyframes shimmer { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
.sk-line { height: 14px; margin-bottom: 10px; }
.sk-line.w60 { width: 60%; } .sk-line.w80 { width: 80%; } .sk-line.w40 { width: 40%; }
.sk-block { height: 96px; border-radius: var(--bmp-radius-md); }

/* 网络异常横幅 */
.net-banner {
  display: none; padding: 8px 16px; background: var(--bmp-color-danger-light);
  color: var(--bmp-color-danger); font-size: 13px; text-align: center;
  border-bottom: 1px solid #FECACA;
}
.net-banner.show { display: flex; align-items: center; justify-content: center; gap: 12px; }

/* 只读横幅（权威源同步时，UI-C-06/07） */
.readonly-banner {
  display: flex; align-items: center; gap: 8px; padding: 8px 16px; margin-bottom: 12px;
  background: var(--bmp-color-warning-light); border: 1px solid #FDE68A;
  border-radius: var(--bmp-radius-sm); font-size: 13px; color: #92400E;
}

/* 高危确认输入 */
.hr-input-hint { font-size: 13px; color: var(--bmp-text-secondary); margin-bottom: 8px; }
.hr-input-hint code { background: var(--bmp-color-info-light); padding: 1px 6px; border-radius: 3px; color: var(--bmp-text-title); font-weight: 600; }

/* ---------- 门户顶栏 ---------- */
.portal-topbar {
  height: var(--bmp-topbar-h); background: #fff; box-shadow: var(--bmp-shadow-1);
  display: flex; align-items: center; padding: 0 24px; gap: 32px;
  position: sticky; top: 0; z-index: 100;
}
.portal-logo { display: flex; align-items: center; gap: 10px; font: var(--bmp-font-h3); color: var(--bmp-text-title); cursor: pointer; }
.portal-logo .logo-mark {
  width: 30px; height: 30px; border-radius: 6px; background: var(--bmp-color-primary);
  color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px;
}
.portal-nav { display: flex; gap: 4px; flex: 1; }
.portal-nav a {
  padding: 6px 14px; border-radius: var(--bmp-radius-sm); color: var(--bmp-text-body);
  display: inline-flex; align-items: center; gap: 5px; font-size: 14px;
}
.portal-nav a:hover { background: var(--bmp-color-primary-light); color: var(--bmp-color-primary); }
.portal-nav a.active { background: var(--bmp-color-primary-light); color: var(--bmp-color-primary); font-weight: 600; }
.portal-right { display: flex; align-items: center; gap: 16px; }
.icon-btn { position: relative; border: none; background: none; font-size: 18px; cursor: pointer; color: var(--bmp-text-secondary); padding: 4px; }
.icon-btn:hover { color: var(--bmp-color-primary); }
.icon-btn .badge-n { position: absolute; top: -4px; right: -8px; }
.avatar {
  width: 32px; height: 32px; border-radius: 50%; background: var(--bmp-color-primary-light);
  color: var(--bmp-color-primary); display: flex; align-items: center; justify-content: center;
  font-weight: 600; font-size: 13px; cursor: pointer;
}
.dropdown { position: relative; }
.dropdown-menu {
  display: none; position: absolute; right: 0; top: calc(100% + 8px); min-width: 160px;
  background: #fff; border-radius: var(--bmp-radius-md); box-shadow: var(--bmp-shadow-2);
  padding: 6px; z-index: 200;
}
.dropdown:hover .dropdown-menu { display: block; }
.dropdown-menu a { display: block; padding: 8px 12px; border-radius: var(--bmp-radius-sm); color: var(--bmp-text-body); font-size: 14px; }
.dropdown-menu a:hover { background: var(--bmp-color-primary-light); color: var(--bmp-color-primary); }
.dropdown-menu .sep { height: 1px; background: var(--bmp-border); margin: 4px 0; }

.portal-main { max-width: 1440px; margin: 0 auto; padding: var(--bmp-space-6); }

/* ---------- 管理控制台外壳 ---------- */
.console-layout { display: flex; min-height: 100vh; }
.console-side {
  width: var(--bmp-console-menu-w); background: #fff; border-right: 1px solid var(--bmp-border);
  flex-shrink: 0; position: sticky; top: 0; height: 100vh; overflow: auto; padding-bottom: 24px;
}
.console-side .side-logo { display: flex; align-items: center; gap: 10px; padding: 14px 20px; font: var(--bmp-font-h3); color: var(--bmp-text-title); border-bottom: 1px solid var(--bmp-border); }
.console-side .side-logo .logo-mark { width: 28px; height: 28px; border-radius: 6px; background: var(--bmp-color-primary); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; }
.menu-group { padding: 8px 12px 0; }
.menu-group .g-title { font: var(--bmp-font-caption); color: var(--bmp-text-placeholder); padding: 10px 8px 4px; }
.menu-group a {
  display: block; padding: 8px 10px; border-radius: var(--bmp-radius-sm);
  color: var(--bmp-text-body); font-size: 14px; margin-bottom: 2px;
}
.menu-group a:hover { background: var(--bmp-color-primary-light); color: var(--bmp-color-primary); }
.menu-group a.active { background: var(--bmp-color-primary-light); color: var(--bmp-color-primary); font-weight: 600; }
.console-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.console-topbar {
  height: 52px; background: #fff; border-bottom: 1px solid var(--bmp-border);
  display: flex; align-items: center; justify-content: space-between; padding: 0 24px;
  position: sticky; top: 0; z-index: 90;
}
.breadcrumb { font-size: 13px; color: var(--bmp-text-secondary); }
.breadcrumb b { color: var(--bmp-text-title); font-weight: 600; }
.console-body { padding: var(--bmp-space-6); flex: 1; }

/* 列表页范式：筛选区 + 操作栏 */
.filter-bar {
  background: #fff; border-radius: var(--bmp-radius-md); box-shadow: var(--bmp-shadow-1);
  padding: 16px 16px 4px; margin-bottom: 12px;
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 0 16px;
}
.filter-bar .field { margin-bottom: 12px; }
.filter-bar .f-ops { grid-column: 4; display: flex; justify-content: flex-end; gap: 8px; align-items: flex-start; padding-bottom: 12px; }
.list-toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.list-toolbar .left { display: flex; gap: 8px; align-items: center; }
.list-toolbar .right { display: flex; gap: 8px; align-items: center; color: var(--bmp-text-secondary); font-size: 13px; }

/* 批量浮条 */
.batch-bar {
  display: none; position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: var(--bmp-text-title); color: #fff; border-radius: var(--bmp-radius-md);
  padding: 10px 20px; gap: 16px; align-items: center; box-shadow: var(--bmp-shadow-3); z-index: 500;
}
.batch-bar.show { display: flex; }
.batch-bar .btn { border-color: rgba(255,255,255,.4); background: transparent; color: #fff; }
.batch-bar .btn:hover { border-color: #fff; }

/* 步骤条（向导） */
.steps { display: flex; align-items: center; gap: 0; margin-bottom: 24px; }
.steps .step { display: flex; align-items: center; gap: 8px; }
.steps .step .n {
  width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  background: var(--bmp-color-info-light); color: var(--bmp-text-secondary); font-size: 13px; font-weight: 600;
}
.steps .step .t { font-size: 14px; color: var(--bmp-text-secondary); }
.steps .step.active .n { background: var(--bmp-color-primary); color: #fff; }
.steps .step.active .t { color: var(--bmp-text-title); font-weight: 600; }
.steps .step.done .n { background: var(--bmp-color-success-light); color: var(--bmp-color-success); }
.steps .line { width: 72px; height: 1px; background: var(--bmp-border-strong); margin: 0 12px; }

/* 描述列表（详情抽屉） */
.desc-grid { display: grid; grid-template-columns: 110px 1fr; gap: 10px 12px; font-size: 14px; }
.desc-grid dt { color: var(--bmp-text-secondary); }
.desc-grid dd { color: var(--bmp-text-title); }

/* 时间线 */
.timeline { border-left: 2px solid var(--bmp-border); padding-left: 16px; margin-left: 6px; }
.timeline .t-item { position: relative; padding-bottom: 16px; }
.timeline .t-item::before {
  content: ""; position: absolute; left: -22px; top: 5px; width: 10px; height: 10px;
  border-radius: 50%; background: #fff; border: 2px solid var(--bmp-color-primary);
}
.timeline .t-time { font: var(--bmp-font-caption); color: var(--bmp-text-placeholder); }

/* 空态/错误态快速类 */
.empty-tip { text-align: center; padding: 40px 0; color: var(--bmp-text-secondary); }
.empty-tip .big { font-size: 40px; margin-bottom: 8px; }

/* ---------- 工作流引擎组件（C1/C2/C3） ---------- */

/* 配置向导：配置方式切换卡 */
.wf-mode-switch { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.wf-mode { border: 2px solid var(--bmp-border); border-radius: var(--bmp-radius-md); padding: 14px 16px; cursor: pointer; transition: all .15s; }
.wf-mode:hover { border-color: var(--bmp-color-primary); }
.wf-mode.sel { border-color: var(--bmp-color-primary); background: var(--bmp-color-primary-light); }
.wf-mode .ic { font-size: 22px; margin-bottom: 4px; }

/* 配置向导：模板卡 */
.wf-tpl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.wf-tpl-card { border: 2px solid var(--bmp-border); border-radius: var(--bmp-radius-md); padding: 12px 14px; cursor: pointer; transition: all .15s; }
.wf-tpl-card:hover { border-color: var(--bmp-color-primary); }
.wf-tpl-card.sel { border-color: var(--bmp-color-primary); background: var(--bmp-color-primary-light); }
.wf-tpl-card .nm { font-size: 14px; font-weight: 600; color: var(--bmp-text-title); }
.wf-tpl-card .ds { font-size: 12px; color: var(--bmp-text-secondary); line-height: 1.6; margin: 4px 0 8px; }
.wf-tpl-card .tags { display: flex; gap: 6px; flex-wrap: wrap; }
/* 空白模板卡片：虚线边框 + 新建标识，与预置模板视觉区分（选中态沿用 .sel） */
.wf-tpl-card.blank { border-style: dashed; border-color: var(--bmp-border-strong); background: var(--bmp-bg-page); position: relative; }
.wf-tpl-card.blank:hover { border-color: var(--bmp-color-primary); border-style: dashed; }
.wf-tpl-card.blank.sel { border-color: var(--bmp-color-primary); border-style: dashed; background: var(--bmp-color-primary-light); }
.wf-tpl-card .wf-tpl-badge { position: absolute; top: -10px; right: 10px; font: var(--bmp-font-caption); font-weight: 600; color: var(--bmp-color-primary); background: var(--bmp-color-primary-light); border: 1px solid var(--bmp-color-primary); border-radius: var(--bmp-radius-sm); padding: 1px 8px; }
.wf-tpl-card .wf-tpl-plus { color: var(--bmp-color-primary); font-weight: 700; margin-right: 4px; }

/* 配置向导：节点行 */
.wf-node-head, .wf-node-row { display: grid; grid-template-columns: 40px 1fr 150px 140px 80px; gap: 10px; align-items: center; }
.wf-node-head { padding: 0 0 8px; border-bottom: 1px solid var(--bmp-border); margin-bottom: 8px; }
.wf-node-row { padding: 8px 0; border-bottom: 1px solid var(--bmp-border); }
.wf-node-row .seq { text-align: center; color: var(--bmp-text-secondary); font-weight: 600; }

/* 配置向导：路由行 */

.wf-canvas-props { background: var(--bmp-bg-card); border: 1px solid var(--bmp-border); border-radius: var(--bmp-radius-md); padding: 12px; box-shadow: var(--bmp-shadow-1); min-height: 300px; }
