<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>重置密码 · 麓邦业务中台</title>
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/common.css">
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
  .forgot-card { width: 420px; max-width: 100%; background: var(--bmp-bg-card); border-radius: var(--bmp-radius-lg); box-shadow: var(--bmp-shadow-2); padding: 28px 32px 32px; }
  .back { font-size: 13px; margin-bottom: 16px; display: inline-block; }
  .forgot-card h2 { font: var(--bmp-font-h2); color: var(--bmp-text-title); margin-bottom: 4px; }
  .forgot-card .sub { font: var(--bmp-font-caption); color: var(--bmp-text-secondary); margin-bottom: 24px; }
  .sms-row { display: flex; gap: 10px; }
  .sms-row .btn { flex-shrink: 0; width: 112px; }
  .strength { display: flex; gap: 6px; margin-top: 8px; }
  .strength .bar { flex: 1; height: 4px; border-radius: 2px; background: var(--bmp-border); transition: background .2s; }
  .strength-tip { font: var(--bmp-font-caption); color: var(--bmp-text-secondary); margin-top: 6px; }
  .done-box { display: none; text-align: center; padding: 32px 0 16px; }
  .done-box .ic { width: 64px; height: 64px; border-radius: 50%; background: var(--bmp-color-success-light); color: var(--bmp-color-success); font-size: 30px; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
</style>
<script src="assets/ui-style.js"></script>
</head>
<body>
<div class="forgot-card">
  <a class="back" href="login.html">← 返回登录</a>
  <div id="formArea">
    <h2>重置密码</h2>
    <div class="sub">验证手机号后设置新密码 · 密码策略与 B1-F05 一致</div>
    <div class="field">
      <label><span class="req">*</span>账号 / 工号</label>
      <input class="input" id="acc" placeholder="如 zhangsan 或 EMP-2020-0031">
      <div class="err-msg">账号不存在，请检查后重试</div>
    </div>
    <div class="field">
      <label><span class="req">*</span>手机号验证</label>
      <div class="sms-row">
        <input class="input" placeholder="6 位短信验证码" maxlength="6">
        <button class="btn" id="btnSms" onclick="sendSms(this)">获取验证码</button>
      </div>
      <div class="tip">验证码发送至主数据登记手机号 138****2231（脱敏展示）</div>
    </div>
    <div class="field">
      <label><span class="req">*</span>新密码</label>
      <input class="input" id="np" type="password" placeholder="8-32 位，需含大小写字母、数字、特殊字符中至少 3 类" oninput="checkStrength(this.value)">
      <div class="strength"><div class="bar" id="b1"></div><div class="bar" id="b2"></div><div class="bar" id="b3"></div><div class="bar" id="b4"></div></div>
      <div class="strength-tip" id="stTip">强度：输入后实时评估</div>
      <div class="err-msg">密码不满足策略要求</div>
    </div>
    <div class="field">
      <label><span class="req">*</span>确认新密码</label>
      <input class="input" id="np2" type="password" placeholder="再次输入新密码">
      <div class="err-msg">两次输入不一致</div>
    </div>
    <button class="btn btn-primary btn-lg" style="width:100%" onclick="submitReset()">确认重置</button>
    <div class="tip mt-3 fs-12 text-secondary" style="text-align:center">无法接收短信？请联系管理员（内线 8000）人工重置</div>
  </div>
  <div class="done-box" id="doneBox">
    <div class="ic">✔</div>
    <h2 style="margin-bottom:8px">密码重置成功</h2>
    <div class="sub" style="margin-bottom:20px">本次重置已写入审计日志，当前全部会话已强制下线（安全要求）</div>
    <button class="btn btn-primary btn-lg" style="width:100%" onclick="location.href='login.html'">使用新密码登录</button>
  </div>
</div>
<script src="assets/mock.js"></script>
<script>
function sendSms(btn) {
  btn.disabled = true; let s = 60;
  btn.textContent = s + "s 后重发";
  const t = setInterval(() => { s--; btn.textContent = s + "s 后重发"; if (s <= 0) { clearInterval(t); btn.disabled = false; btn.textContent = "获取验证码"; } }, 1000);
  msg("success", "验证码已发送（模拟：任意 6 位数字均可）");
}
function checkStrength(v) {
  let score = 0;
  if (v.length >= 8) score++;
  if (/[a-z]/.test(v) && /[A-Z]/.test(v)) score++;
  if (/\d/.test(v)) score++;
  if (/[^a-zA-Z0-9]/.test(v)) score++;
  const colors = ["var(--bmp-color-danger)", "var(--bmp-color-danger)", "var(--bmp-color-warning)", "var(--bmp-color-success)", "var(--bmp-color-success)"];
  const labels = ["输入后实时评估", "弱：不满足策略", "弱：至少需 3 类字符", "中：符合策略", "强：非常安全"];
  for (let i = 1; i <= 4; i++) document.getElementById("b" + i).style.background = i <= score ? colors[score] : "var(--bmp-border)";
  document.getElementById("stTip").textContent = "强度：" + labels[score];
}
function submitReset() {
  const np = document.getElementById("np").value, np2 = document.getElementById("np2").value;
  let ok = true;
  const setErr = (id, bad) => { document.getElementById(id).classList.toggle("has-error", bad); if (bad) ok = false; };
  setErr("acc", false);
  if (np.length < 8) { setErr("np", true); ok = false; } else setErr("np", false);
  if (np !== np2) { document.getElementById("np2").parentElement.classList.add("has-error"); ok = false; }
  else document.getElementById("np2").parentElement.classList.remove("has-error");
  if (!ok) { msg("error", "请检查表单错误项"); return; }
  msg("success", "重置成功，全部会话已下线");
  setTimeout(() => { document.getElementById("formArea").style.display = "none"; document.getElementById("doneBox").style.display = "block"; }, 600);
}
</script>
</body>
</html>
